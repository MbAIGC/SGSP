name: 构建与验证

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install --include=dev

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 冒烟验证
        run: npm run smoke

      - name: 打包插件
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p package/SY-GSP
          cp index.js index.css plugin.json icon.png README.md README_en_US.md package/SY-GSP/
          cp -r i18n package/SY-GSP/
          cd package && zip -r "../SY-GSP-${GITHUB_REF_NAME}.zip" SY-GSP

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SY-GSP-*.zip
          generate_release_notes: true
